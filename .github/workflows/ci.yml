name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --extra test
      - run: uv run --no-sync pytest -q

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:contract
      - run: node --test tests/*.test.mjs
      - run: npm run build

  image-build:
    name: Build Docker image (${{ matrix.arch }})
    needs: [backend, frontend]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
        shell: bash
      - name: Build and push arch image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          ARCH_TAG="${IMAGE}:sha-${SHORT_SHA}-${ARCH}"
          LOCAL_TAG="colab-gpu-studio:${GITHUB_SHA}-${ARCH}"

          docker build \
            --provenance=false \
            --sbom=false \
            --tag "${LOCAL_TAG}" \
            --tag "${ARCH_TAG}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-only" \
            .
          docker push "${ARCH_TAG}"
        shell: bash
      - name: Export image artifact
        env:
          ARCH: ${{ matrix.arch }}
        run: docker save "colab-gpu-studio:${GITHUB_SHA}-${ARCH}" | gzip > "${RUNNER_TEMP}/colab-gpu-studio-${ARCH}.tar.gz"
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: colab-gpu-studio-${{ github.sha }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/colab-gpu-studio-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  image-merge:
    name: Publish multi-arch manifest
    needs: [image-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
        shell: bash
      - name: Create and push multi-arch manifest
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          DEFAULT_BRANCH="${DEFAULT_BRANCH:-main}"

          TAGS=(
            "${IMAGE}:sha-${SHORT_SHA}"
          )
          if [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
            SAFE_BRANCH="${DEFAULT_BRANCH//[^A-Za-z0-9_.-]/-}"
            TAGS+=("${IMAGE}:latest" "${IMAGE}:${SAFE_BRANCH}")
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            SAFE_TAG="${GITHUB_REF_NAME//[^A-Za-z0-9_.-]/-}"
            TAGS+=("${IMAGE}:${SAFE_TAG}")
          fi

          CREATE_ARGS=(
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}"
            --annotation "index:org.opencontainers.image.licenses=AGPL-3.0-only"
          )
          for tag in "${TAGS[@]}"; do
            CREATE_ARGS+=(--tag "${tag}")
          done

          docker buildx imagetools create "${CREATE_ARGS[@]}" \
            "${IMAGE}:sha-${SHORT_SHA}-amd64" \
            "${IMAGE}:sha-${SHORT_SHA}-arm64"

          docker buildx imagetools inspect "${IMAGE}:sha-${SHORT_SHA}"
        shell: bash
